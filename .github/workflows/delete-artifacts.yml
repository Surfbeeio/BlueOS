name: Delete all artifacts

# Manual one-off cleanup: removes every stored Actions artifact in this repo.
on: workflow_dispatch

permissions:
  actions: write

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          echo "Found $(echo "$ids" | grep -c .) artifacts"
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "deleted $id"
          done
