# This is the mavlink-router configuration file.
[General]
# Suppress "%u messages to unknown endpoints in the last %d seconds" warnings
DebugLogLevel = error

[UartEndpoint cube]
Device = /dev/ttyAMA3
# Do not modify this baud rate manually. It is supposed to be modified
# dynamically by LoggerFirmware, when a user sets the autopilot baud rate in
# the Web UI. LoggerFirmware knows which line it is supposed to modify because
# it looks for the first matching line after the marker word "plenderaceous".
# For that reason, you must not remove this marker word from this comment.
Baud = 115200

[UdpEndpoint local]
Mode = normal
Address = 127.0.0.1
Port = 6841

[UdpEndpoint blueos]
Mode = server
Address = 0.0.0.0
Port = 6842
